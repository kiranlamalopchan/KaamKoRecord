// The Wear OS app: clock in, breaks and clock out from the wrist.
// Copied into android/wear by plugins/with-wear-app.js, which also passes the
// version and package below. It shares the phone app's package name and
// signing key — the Wearable Data Layer only connects apps that match.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def wear = new Properties()
file("wear.properties").withInputStream { wear.load(it) }

android {
  namespace "com.kiranlama.mywork.wear"
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId wear.getProperty("applicationId")
    minSdk 30           // Wear OS 3
    targetSdk rootProject.ext.targetSdkVersion
    versionCode wear.getProperty("versionCode").toInteger()
    versionName wear.getProperty("versionName")
    manifestPlaceholders = [usesCleartextTraffic: wear.getProperty("usesCleartextTraffic")]
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
    }
  }

  buildFeatures { compose true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
}

dependencies {
  implementation platform("androidx.compose:compose-bom:2026.09.00")
  implementation "androidx.activity:activity-compose:1.13.0"
  implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
  implementation "androidx.wear.compose:compose-material:1.7.1"
  implementation "androidx.wear.compose:compose-foundation:1.7.1"
  implementation "androidx.compose.material:material-icons-core"
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0"
  // The watch-face complication and the tile.
  implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0"
  implementation "androidx.wear.tiles:tiles:1.6.2"
  implementation "androidx.wear.protolayout:protolayout:1.4.2"
  implementation "androidx.concurrent:concurrent-futures:1.3.0"
}

// On EAS the phone app's upload key is injected into app/; the watch is signed with the same one.
def easCredentials = file("../app/eas-build-inject-android-credentials.gradle")
if (easCredentials.exists()) apply from: easCredentials
