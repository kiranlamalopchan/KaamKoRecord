# The edge nginx: the one program on this VPS listening on ports 80 and 443. It belongs to
# neither site. It only looks at which domain is being asked for and passes the connection to
# that site's own nginx:
#
#   bideshkosathi.com  ->  Bideshkosathi's nginx  (bideshkosathi-nginx, /opt/bideshkosathi)
#   kaamkorecord.com   ->  KaamKoRecord's nginx   (kaamkorecord-nginx,  /root/kaamkorecord)
#
# HTTPS is never decrypted here: each site's nginx holds its own certificate. The visitor's
# address travels on as a PROXY protocol header (443) or X-Forwarded-For (80).
# Anything for another name, such as scanners calling the bare IP address, is dropped.

worker_processes auto;
events { worker_connections 4096; }

stream {
    # Docker's own DNS, asked on each connection: a site's nginx gets a new address when it
    # restarts, and the edge keeps running when one site is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $site {
        bideshkosathi.com        bideshkosathi-nginx:443;
        www.bideshkosathi.com    bideshkosathi-nginx:443;
        kaamkorecord.com         kaamkorecord-nginx:443;
        www.kaamkorecord.com     kaamkorecord-nginx:443;
        # Nothing listens here, so the connection is refused straight away.
        default                  127.0.0.1:1;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $site;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Long enough for the live event stream and chat WebSockets, which stay open.
        proxy_timeout 75m;
    }
}

http {
    server_tokens off;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $site80 {
        hostnames;
        bideshkosathi.com        bideshkosathi-nginx;
        www.bideshkosathi.com    bideshkosathi-nginx;
        kaamkorecord.com         kaamkorecord-nginx;
        www.kaamkorecord.com     kaamkorecord-nginx;
        default                  "";
    }

    # Port 80 is only certificate checks and the redirect to HTTPS, both answered by the site.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        if ($site80 = "") {
            return 444;
        }

        location / {
            proxy_pass http://$site80:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
        }
    }
}
